        <div class="row g-4">
            <section class="col-md-7" id="lista"></section>
            <aside class="col-md-5">
                <h2>Deixe sua avaliação</h2>
                <form id="formDep">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control campo" required minlength="3" placeholder="Seu nome">
                    </div>
                    <div class="mb-3">
                        <label for="nota" class="form-label">Nota</label>
                        <select id="nota" class="form-select campo">
                            <option>5</option>
                            <option>4</option>
                            <option>3</option>
                            <option>2</option>
                            <option>1</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="texto" class="form-label">Comentário</label>
                        <textarea id="texto" class="form-control campo" rows="4" required minlength="10" placeholder="Seu comentário"></textarea>
                    </div>
                    <button type="submit" class="btn btn-ouro">Publicar</button>
                </form>
            </aside>
        </div>
